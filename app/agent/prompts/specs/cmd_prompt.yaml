# Stage 1: routing, tool selection and UI intents. Rule texts: rules/command.json, rules/context.json
sections:
  - title: Orchestration Stage
    style: lines
    rules: [command_role]

  - title: User Context
    rules:
      - fact_user_name
      - fact_timezone
      - fact_default_city
      - fact_default_country
      - fact_language_fallback
      - respond_in_message_language
      - fact_measurement_units
      - fact_currency
      - {rule: fact_spotify, when: state.spotify}
      - {rule: spotify_status_is_not_library, when: state.spotify}

  - title: Your Task
    style: lines
    rules: [decide_next_action]
  - style: numbered
    rules:
      - identify_intent
      - choose_action_type
      - specify_tool_calls
      - list_missing_parameters

  - title: Decision Types
    rules:
      - action_function_call
      - action_parameters_request
      - action_final_response
  - style: lines
    rules: [never_offer_search]

  - title: When to use tools vs internal knowledge
    style: paragraphs
    rules:
      - search_for_live_data
      - answer_from_knowledge_cases
      - search_when_in_doubt

  - title: Guidelines
    rules:
      - explain_reasoning
      - run_tools_in_parallel
      - request_only_required_parameters
      - ask_when_uncertain
      - confirm_important_operations
      - watch_current_date
      - defer_actions_with_cron
      - smarthome_act_without_confirmation
      - smarthome_infer_parameters
      - stop_when_results_complete
      - gmail_read_only
      - load_matching_skill

  - title: UI Intents (for response_format=ui_answer only)
    style: lines
    rules:
      - fill_ui_intents
      - required_ui_intents
      - other_ui_intents
      - ui_intents_scope

  - style: lines
    rules: [follow_decision_schema]
