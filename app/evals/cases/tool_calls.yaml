# Stage 1 tool selection: the command prompt picks the right tool for the request.

- id: tools.light_off
  name: Выключить свет
  description: Управление светом идёт через smarthome_control_tool сразу, без подтверждения.
  tags: [smarthome]
  input: "Выключи свет в спальне"
  response_format: plain
  stage: stage1
  expect:
    action_type: function_call
    tools_called: [smarthome_control_tool]

- id: tools.climate_set
  name: Установить температуру
  description: Управление климатом идёт через smarthome_control_tool сразу, без подтверждения.
  tags: [smarthome]
  input: "Установи температуру 22 градуса"
  response_format: plain
  stage: stage1
  expect:
    action_type: function_call
    tools_called: [smarthome_control_tool]

- id: tools.spotify_genre
  name: Джаз на Spotify
  description: Музыкальный запрос с жанром идёт в spotify_tool.
  tags: [music]
  input: "Включи джаз на Spotify"
  response_format: plain
  stage: stage1
  expect:
    action_type: function_call
    tools_called: [spotify_tool]

- id: tools.google_search
  name: Поиск кинотеатров
  description: Общий информационный поиск идёт в google_search_tool.
  tags: [search]
  input: "Найди информацию о ближайших кинотеатрах"
  response_format: plain
  stage: stage1
  expect:
    action_type: function_call
    tools_called: [google_search_tool]

- id: tools.task_reminder
  name: Напоминание позвонить
  description: Личное напоминание с датой становится задачей в task_tool, а не отложенным действием в cron_tool.
  tags: [tasks]
  input: "Напомни мне завтра позвонить врачу"
  response_format: plain
  stage: stage1
  expect:
    action_type: function_call
    tools_called: [task_tool]

- id: tools.note
  name: Запись в заметки
  description: Просьба записать в заметки идёт в notes_tool.
  tags: [notes]
  input: "Запиши в заметки: купить подарок"
  response_format: plain
  stage: stage1
  expect:
    action_type: function_call
    tools_called: [notes_tool]

- id: tools.football_score
  name: Счёт матча
  description: Футбольный запрос загружает runtime-скилл football через skill_loader_tool.
  tags: [football]
  input: "Какой счёт в последнем матче Реал Мадрид?"
  response_format: plain
  stage: stage1
  expect:
    action_type: function_call
    tools_called: [skill_loader_tool]
