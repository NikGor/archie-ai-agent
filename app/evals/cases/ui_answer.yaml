# Full pipeline, ui_answer: right UI components, forms and quick actions; judge scores quality.
# Tag `mini` marks a cheap subset for quick model comparison.

- id: ui.weather_london
  name: Погода в Лондоне
  description: Прогноз погоды рендерится карточкой погоды в card_grid и даёт быстрые действия.
  tags: [weather]
  input: "какая завтра погода в Лондоне?"
  response_format: ui_answer
  stage: full
  judge: true
  expect:
    content_not_empty: true
    min_ui_items: 1
    expected_item_types: [card_grid]
    has_quick_actions: true
    max_total_tokens: 25000
    max_latency_ms: 35000

